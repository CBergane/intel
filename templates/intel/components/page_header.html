<header data-page-header="true" class="page-header">
    <div class="min-w-0">
        {% if page_group %}
            <p class="page-eyebrow">{{ page_group }}</p>
        {% endif %}
        <h1 class="page-title">{{ page_title }}</h1>
        {% if page_description %}
            <p class="page-description">{{ page_description }}</p>
        {% endif %}
    </div>
    {% if page_action_url %}
        <a href="{{ page_action_url }}" class="page-action">{{ page_action_label }}</a>
    {% endif %}
</header>
