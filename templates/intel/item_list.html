{% extends "base.html" %}

{% block title %}{{ page_title }} | BorealSec Intel{% endblock %}

{% block content %}
<section class="intelligence-list-page" data-intelligence-list="{{ list_semantic_key }}">
    {% include "intel/components/page_header.html" with page_action_url=request.path page_action_label="Reset filters" %}

    <form method="get" class="intelligence-filters" aria-label="Filter intelligence">
        <div class="intelligence-filter intelligence-filter--search">
            <label for="id_q">Search</label>
            <input id="id_q" name="q" value="{{ query }}" placeholder="CVE, source, keyword"
                   hx-get="{{ request.path }}"
                   hx-trigger="keyup changed delay:400ms"
                   hx-target="#items-list"
                   hx-swap="innerHTML"
                   hx-include="closest form">
        </div>
        <div class="intelligence-filter">
            <label for="id_source">Source</label>
            <select id="id_source" name="source">
                <option value="">All sources</option>
                {% for source in sources %}
                    <option value="{{ source.slug }}" {% if selected_source == source.slug %}selected{% endif %}>{{ source.name }} · {{ source.count }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="intelligence-filter">
            <label for="id_time">Time</label>
            <select id="id_time" name="time">
                {% for value, label in time_options %}
                    <option value="{{ value }}" {% if selected_time == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="intelligence-filter-actions">
            <button type="submit">Apply filters</button>
            <a href="{{ request.path }}">Reset</a>
        </div>
    </form>

    <div id="items-list">
        {% include "intel/partials/items_list.html" %}
    </div>
</section>
{% endblock %}
